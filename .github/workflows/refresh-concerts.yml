name: Refresh concert listings

# 13:43 UTC = 6:43am Los Angeles (PDT). Runs on GitHub's servers, so there is
# no CORS restriction, no API key, and nothing to install on any device.
on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:      # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-concerts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild LA listings
        run: node scripts/refresh-concerts.mjs la

      - name: Commit if anything changed
        run: |
          git config user.name  "sanctum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concerts-*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Concerts: refresh listings [skip ci]"
            git push
          fi
