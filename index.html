<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="BatVault — a private, offline personal finance tracker. Your data never leaves your phone.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BATVAULT</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/tabler-icons.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main id="app"><!-- rendered by app.js --></main>

  <div id="chrome" style="display:none">
    <button class="fab" id="fab" aria-label="Add transaction">+</button>
    <nav class="nav">
      <button data-nav="dashboard" class="active"><span class="ni">🏠</span>Home</button>
      <button data-nav="transactions"><span class="ni">🧾</span>Activity</button>
      <button data-nav="budgets"><span class="ni">🎯</span>Budgets</button>
      <button data-nav="more"><span class="ni">☰</span>More</button>
    </nav>
  </div>

  <div id="toast"></div>

  <script>
  (function () {
    function box(title, detail) {
      var app = document.getElementById('app') || document.body;
      var d = document.createElement('div');
      d.style.cssText = 'margin:16px;padding:14px;border:1px solid #ff5a5f;border-radius:12px;background:#1a0e10;color:#ffd7d8;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word';
      d.textContent = '⚠ ' + title + '\n\n' + detail;
      app.appendChild(d);
    }
    window.addEventListener('error', function (e) {
      box('Error', (e.message || e.type || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n' + ((e.error && e.error.stack) || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason || {};
      box('Unhandled promise rejection', (r.message || String(r)) + '\n' + (r.stack || ''));
    });
    // If nothing rendered after 6s, offer a reset that clears the cached app.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.children.length === 0) {
        var w = document.createElement('div');
        w.style.cssText = 'margin:48px 16px;text-align:center;font-family:system-ui,sans-serif;color:#e8ebf2';
        w.innerHTML = '<div style="font-size:15px;margin-bottom:6px">BATVAULT didn’t finish loading.</div><div style="font-size:13px;color:#8b93a7;margin-bottom:16px">Clear the cached version and reload.</div>';
        var b = document.createElement('button');
        b.textContent = 'Reset app & reload';
        b.style.cssText = 'padding:12px 20px;border-radius:12px;background:#f5c542;color:#1a1400;font-weight:600;border:none;font-size:15px';
        b.onclick = async function () {
          try { if ('serviceWorker' in navigator) { var rs = await navigator.serviceWorker.getRegistrations(); for (var i = 0; i < rs.length; i++) await rs[i].unregister(); } } catch (x) {}
          try { if (window.caches) { var ks = await caches.keys(); for (var j = 0; j < ks.length; j++) await caches.delete(ks[j]); } } catch (x) {}
          location.reload();
        };
        w.appendChild(b); app.appendChild(w);
      }
    }, 6000);
  })();
  </script>
  <script type="module" src="./js/shell.js"></script>
</body>
</html>
